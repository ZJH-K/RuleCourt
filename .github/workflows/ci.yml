name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev --locked
      - run: uv run --locked basedpyright rulecourt
      - run: uv run --locked ruff check rulecourt tests
      - run: uv run --locked ruff format --check rulecourt tests
      - run: uv run --locked pytest -q

